server {
    listen 443 ssl;
    http2 on;
    server_name cfdnacos.nexbyte.top;

    ssl_certificate /etc/nginx/ssl/cfdnacos.nexbyte.top_bundle.pem;
    ssl_certificate_key /etc/nginx/ssl/cfdnacos.nexbyte.top.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:CampusFoodTLS:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=15552000" always;

    auth_basic "Restricted Nacos Console";
    auth_basic_user_file /etc/nginx/conf.d/cfdnacos.htpasswd;

    resolver 127.0.0.11 valid=30s ipv6=off;
    set $nacos_console campus-food-nacos-console;

    # Nacos 3.1.1 sends the token in both Authorization and AccessToken.
    # Keep AccessToken and let the browser retain its Basic Authorization header.
    location = /js/main.js {
        proxy_pass http://$nacos_console:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Accept-Encoding "";
        sub_filter_types text/javascript application/javascript;
        sub_filter_once on;
        sub_filter 'Authorization:localStorage.getItem("token")||void 0,AccessToken:u' 'AccessToken:u';
    }

    location / {
        proxy_pass http://$nacos_console:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
