server {
    listen 443 ssl;
    http2 on;
    server_name cfdadmin.nexbyte.top;

    ssl_certificate /etc/nginx/ssl/cfdadmin.nexbyte.top_bundle.pem;
    ssl_certificate_key /etc/nginx/ssl/cfdadmin.nexbyte.top.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:CampusFoodTLS:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=15552000" always;

    resolver 127.0.0.11 valid=30s ipv6=off;
    set $admin_web campus-admin-web;
    set $campus_gateway campus-gateway;

    location /api/admin/ {
        proxy_pass http://$campus_gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location ~ ^/(?:api/user|internal)(?:/|$) { return 404; }

    location / {
        proxy_pass http://$admin_web:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
