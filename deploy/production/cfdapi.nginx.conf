server {
    listen 443 ssl;
    http2 on;
    server_name cfdapi.nexbyte.top;

    ssl_certificate /etc/nginx/ssl/cfdapi.nexbyte.top_bundle.pem;
    ssl_certificate_key /etc/nginx/ssl/cfdapi.nexbyte.top.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:CampusFoodTLS:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=15552000" always;

    resolver 127.0.0.11 valid=30s ipv6=off;
    set $campus_gateway campus-gateway;

    location /api/user/ {
        proxy_pass http://$campus_gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location /api/merchant/ {
        client_max_body_size 2m;
        proxy_pass http://$campus_gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location /api/rider/ {
        client_max_body_size 5m;
        proxy_pass http://$campus_gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location / { return 404; }
}
