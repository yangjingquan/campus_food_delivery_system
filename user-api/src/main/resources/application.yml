server:
  port: ${SERVER_PORT:8081}
  error:
    include-message: always
spring:
  config:
    # 本地保留文件配置作为兜底；Nacos 中创建同名 YAML 后可覆盖服务配置。
    import: optional:nacos:user-api.properties?group=DEFAULT_GROUP
  application:
    name: user-api
  cloud:
    nacos:
      config:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/campus_admin?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${DB_USER:campus}
    password: ${DB_PASSWORD:campus_local_only}
  flyway:
    enabled: true
    table: flyway_user_api_schema_history
    baseline-on-migrate: true
    baseline-version: 0
app:
  wechat:
    app-id: ${WECHAT_USER_APP_ID:wxb2ef21a4d9800f4e}
    app-secret: ${WECHAT_USER_APP_SECRET:}
  payment:
    mode: ${USER_PAYMENT_MODE:disabled}
  internal-api-key: ${USER_API_INTERNAL_KEY:}
  location-expiry-seconds: ${USER_LOCATION_EXPIRY_SECONDS:60}
  session-hours: ${USER_SESSION_HOURS:24}
  unpaid-timeout-minutes: ${USER_UNPAID_TIMEOUT_MINUTES:30}
